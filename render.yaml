# Render blueprint — https://render.com/docs/blueprint-spec
#
# Castle Survivor is a pure client-side game: ES modules and assets served
# straight off disk, no backend and no build step. So this is a Static Site
# with an empty build command and the repository root as the publish path.
services:
  - type: web
    runtime: static
    name: castle-survivor
    branch: master
    # No bundler, no transpile. The game runs from source as committed.
    buildCommand: ""
    staticPublishPath: .
    headers:
      # GLB models and audio are content-hashed by name and never edited in
      # place, so they can be cached hard. The HTML and JS must not be.
      - path: /Game3DAssets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /audio/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*.js
        name: Cache-Control
        value: no-cache
