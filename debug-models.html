<!DOCTYPE html>
<html><head><title>Debug Models</title></head>
<body style="margin:0;background:#333">
<div id="info" style="position:fixed;top:10px;left:10px;color:#fff;font-family:monospace;font-size:14px;z-index:100;background:rgba(0,0,0,0.7);padding:10px;max-height:90vh;overflow:auto"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x444444);
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.01, 1000);
camera.position.set(0, 5, 10);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1));
scene.add(new THREE.DirectionalLight(0xffffff, 1));
scene.add(new THREE.GridHelper(20, 20));

const loader = new GLTFLoader();
const info = document.getElementById('info');
const files = [
  'knightWithAnimations.glb',
  'goblineWithAnimations.glb',
  'orgreWithAnimations.glb',
  'grassTile1WithMesh_00001_.glb',
  'HumanCastle.glb',
  'coinWithMesh_00001_.glb',
];
let xOffset = 0;
for (const file of files) {
  loader.load('Game3DAssets/' + file, (gltf) => {
    const model = gltf.scene;
    model.position.x = xOffset;
    scene.add(model);

    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    info.innerHTML += `<b>${file}</b><br>`;
    info.innerHTML += `  Size: ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)}<br>`;
    info.innerHTML += `  Center: ${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)}<br>`;
    info.innerHTML += `  Position: ${model.position.x.toFixed(2)}, ${model.position.y.toFixed(2)}, ${model.position.z.toFixed(2)}<br>`;
    info.innerHTML += `  Children: ${model.children.length}<br>`;
    model.traverse(c => {
      if (c.isMesh) {
        info.innerHTML += `  Mesh: "${c.name}" visible=${c.visible} geo=${c.geometry?.attributes?.position?.count || 0} verts<br>`;
      }
    });
    info.innerHTML += `  Animations: ${gltf.animations.map(a=>a.name).join(', ')}<br><br>`;

    // Play first animation if exists
    if (gltf.animations.length > 0) {
      const mixer = new THREE.AnimationMixer(model);
      mixer.clipAction(gltf.animations[0]).play();
      mixers.push(mixer);
    }

    xOffset += Math.max(size.x, 3) + 2;
  }, undefined, (err) => {
    info.innerHTML += `<span style="color:red">FAILED: ${file} - ${err.message}</span><br>`;
  });
}

const mixers = [];
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  for (const m of mixers) m.update(dt);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
